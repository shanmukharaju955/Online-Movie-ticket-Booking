<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – SHANMUKHA CINEVERSE</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-film"></i>
        <span>SHANMUKHA</span> CINEVERSE
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="movies.html" class="nav-link">Movies</a></li>
        <li><a href="theatres.html" class="nav-link">Theatres</a></li>
      </ul>

      <div class="nav-actions">
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Form Container -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(139, 92, 246, 0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--accent-violet); font-size: 1.4rem;">
          <i class="fa-solid fa-user-lock"></i>
        </div>
        <h2>Sign In to SHANMUKHA CINEVERSE</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Access your tickets, fast seat checkout & member perks</p>
      </div>

      <!-- Quick Demo Account Fill -->
      <div class="demo-credentials-box">
        <p><i class="fa-solid fa-wand-magic-sparkles"></i> 1-Click Demo Credentials:</p>
        <div class="demo-buttons-row">
          <button type="button" class="btn btn-secondary btn-sm" id="fill-customer-demo" style="flex: 1;">
            <i class="fa-solid fa-user"></i> Customer Demo
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="fill-admin-demo" style="flex: 1;">
            <i class="fa-solid fa-shield-halved"></i> Admin Demo
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Cineverse
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.9rem;">
        Don't have an account yet? 
        <a href="register.html" style="color: var(--accent-violet); font-weight: 600;">Register now</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
